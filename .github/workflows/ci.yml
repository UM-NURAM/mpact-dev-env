name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  INSTALL_PREFIX: "/opt/mpact"

jobs:
  ubuntu24:
    name: Ubuntu 24.04
    runs-on: ubuntu-24.04

    steps:
      - name: Show Runner info
        run: |
          cat /etc/os-release
          uname -a
          nproc
          lscpu

      - name: Setup install directory
        run: |
          sudo mkdir -p "${INSTALL_PREFIX}"
          sudo chown -R "$(id -u):$(id -g)" "${INSTALL_PREFIX}"

      - name: Install prereqs
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            gcc g++ gfortran \
            cmake make git   \
            python3             \
            python3-venv        \
            python3-pip         \
            python3-numpy       \
            python3-matplotlib  \
            python3-pandas      \
            python3-h5py        \
            libpng-dev

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S mpact_tpls -B mpact_tpls/build -D CMAKE_INSTALL_PREFIX="${INSTALL_PREFIX}" -D MPACT_TPLs_BUILD_PARALLEL=2

      - name: Build and Install
        run: |
          cmake --build mpact_tpls/build

  rocky8:
    name: RockyLinux 8.10
    runs-on: ubuntu-24.04
    container: rockylinux:8

    steps:
      - name: Show Runner info
        run: |
          cat /etc/os-release
          uname -a
          nproc
          lscpu

      - name: Setup install directory
        run: |
          sudo mkdir -p "${INSTALL_PREFIX}"
          sudo chown -R "$(id -u):$(id -g)" "${INSTALL_PREFIX}"

      - name: Install prereqs
        run: |
          sudo dnf install -y \
            gcc gcc-c++ gfortran \
            cmake make git \
            libpng-devel \
            python3

      - name: Install Python packages
        run: |
          python3 -m pip install --user numpy matplotlib pandas h5py

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S mpact_tpls -B mpact_tpls/build -D CMAKE_INSTALL_PREFIX="${INSTALL_PREFIX}" -D MPACT_TPLs_BUILD_PARALLEL=2

      - name: Build and Install
        run: |
          cmake --build mpact_tpls/build
